name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.61

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build-web/_deps
          key: fetchcontent-em-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: fetchcontent-em-

      - name: Configure
        run: emcmake cmake -B build-web -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-web --parallel 2

      - name: Prepare site
        run: |
          mkdir _site
          cp build-web/src/galaxysim.html _site/index.html
          cp build-web/src/galaxysim.js   _site/galaxysim.js
          cp build-web/src/galaxysim.wasm _site/galaxysim.wasm

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
